name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # The manpage ships in the repository, so a broken one should fail the build
      # rather than surface the first time somebody runs `man pkram`.
      - name: Check manpage renders
        run: |
          test -f man/pkram.1
          mandoc -T lint man/pkram.1 || true
          MANWIDTH=80 man ./man/pkram.1 > /dev/null
